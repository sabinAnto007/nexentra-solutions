server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # the site is one hand-written file; don't advertise the server version
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml application/manifest+json;

    # nginx's add_header does not merge: a location that sets any header
    # discards every add_header inherited from the server block. So the
    # security three are repeated in each location that adds Cache-Control.
    add_header X-Content-Type-Options nosniff        always;
    add_header X-Frame-Options        SAMEORIGIN     always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # index.html carries all the CSS and JS inline, so it must never be
    # served stale — a cached copy would pin the whole site to an old build
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff        always;
        add_header X-Frame-Options        SAMEORIGIN     always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # static assets are content-stable; let the browser keep them
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff        always;
        add_header X-Frame-Options        SAMEORIGIN     always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        access_log off;
    }

    # no CSP header here on purpose: index.html is deliberately a single file
    # with inline <style> and <script>, so any useful CSP would need
    # 'unsafe-inline' and buy nothing. Add one if the site is ever split up.

    location / {
        try_files $uri $uri/ =404;
    }

    # container health probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
